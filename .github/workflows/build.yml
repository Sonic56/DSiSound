name: Build DSi Sound APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --info 2>&1 | tail -100

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DSiSound-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DSi Sound v1.0.${{ github.run_number }}"
          body: |
            ## DSi Sound for Android 🎵🐣
            Download **app-debug.apk** and install it.
            > Enable Settings → Security → Install unknown apps first.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
